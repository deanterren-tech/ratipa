<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Rounded elegant background card -->
  <rect width="128" height="128" rx="32" fill="#0f172a" />
  
  <!-- Subtle inner ambient glow border -->
  <rect x="2" y="2" width="124" height="124" rx="30" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- Sleek, modern dynamic 'R' logo with logistics/route direction symbolism -->
  <g transform="translate(19, 19)">
